name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "codex/pagelens-*"]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: Bundle is up to date
        run: git diff --exit-code extension/vendor/agent-loop-mini.mjs
      - name: TikTok MX draft and PTC tests
        run: |
          node tools/test-tiktok-mx-commerce.mjs
          node tools/test-tiktok-mx-ptc.mjs
      - name: Native host tests
        run: node native/test_host.mjs
      - name: Native gateway (socket broker + MCP shim) tests
        run: node native/test_gateway.mjs
      - run: npm audit --audit-level=high
